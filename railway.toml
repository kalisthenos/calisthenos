# Railway deploy config. Railway picks up the Dockerfile automatically for
# production builds.
#
# Po segmencie S6 usługa FE nie ma ani bazy, ani wolumenu: dane bierze z BE
# (`calisthenos-be`), a bajty plików leżą w R2 po tamtej stronie. Migracje są
# tam też — tutaj nie ma czego migrować. `docker-compose.yml` (lokalny Postgres)
# zniknął w tym samym segmencie.
#
# Note: Railway's `startCommand` (below) REPLACES the Dockerfile's CMD — it does
# not extend it. Dziś oba mówią to samo (`npm run start`), więc rozjazd nie
# zmienia zachowania; wcześniej CMD odpalało jeszcze migracje i seed.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start"
# `react-router-serve` listens on $PORT (Railway injects this).
# Healthcheck MUSI dostać 200 — Railway KAŻDĄ inną odpowiedź (w tym 302)
# raportuje jako „failed with service unavailable". Trasa "/" przekierowuje
# zawsze (app/routes/_index.tsx), więc sondą jest dedykowana trasa zasobowa.
# Pilnuje tego `app/routes/healthz.test.ts`.
healthcheckPath = "/healthz"
# Zapas na zimny start: pobranie obrazu + boot `react-router-serve`. Sonda jest
# płytka (nie woła BE), więc nie czeka na backend — ale kontener po restarcie
# i tak potrzebuje więcej niż domyślne 30 s.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required environment variables (set in Railway UI):
#   BASE_URL              → https://<your-domain>
#   NODE_ENV              → production
#   API_URL               → adres BE (sieć prywatna Railway, jeśli dostępna)
#   API_PUBLIC_URL        → publiczny adres BE (dla <img>/<video>); domyślnie = API_URL
#   CLIENT_FORWARDING_SECRET → losowy sekret (min. 32 znaki), TA SAMA wartość w serwisach FE,
#                           API i worker (ADR-0048 w BE); bez niego FE na produkcji nie wstaje
#   GITHUB_TOKEN          → build-time, read:packages (prywatny @kalisthenos/api-client)
#
# Opcjonalne: MAX_UPLOAD_BYTES, MAX_VIDEO_UPLOAD_BYTES (limity walidowane też
# po stronie BE — tutaj służą wyłącznie wczesnej odmowie przed wysyłką).
